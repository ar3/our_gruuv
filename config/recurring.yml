    queue: default
    schedule: at 5am every day

  daily_operational_cleanup:
    class: DailyOperationalCleanupJob
    queue: default
    schedule: at 5am every day

  daily_refresh_observation_health_caches:
    class: DailyRefreshObservationHealthCachesJob
    queue: default
    schedule: at 5am every day

  daily_refresh_engagement_health_statuses:
    class: DailyRefreshEngagementHealthStatusesJob
    queue: default
    schedule: at 5am every day

  daily_refresh_assignment_expectation_alignment_scores:
    class: DailyRefreshAssignmentExpectationAlignmentScoresJob
    queue: default
    schedule: at 5:15am every day

  daily_refresh_aspiration_expectation_alignment_scores:
    class: DailyRefreshAspirationExpectationAlignmentScoresJob
    queue: default
    schedule: at 5:20am every day

  snapshot_engagement_health_weekly_rollups:
